services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nadeck}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nadeck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      # Loopback-only, for running the backend locally outside Docker (nest start --watch).
      # Not 5432/5433 — those are already taken by other projects' Postgres containers
      # on this host. Not reachable from the network, only from this machine itself.
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nadeck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/nadeck-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nadeck}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nadeck}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/categories',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/nadeck-frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  nadeck-bot:
    build:
      context: .
      dockerfile: apps/nadeck-bot/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_URL=http://backend:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL}
    volumes:
      - ./apps/nadeck-bot/data:/app/apps/nadeck-bot/data

  gender-router-bot:
    build:
      context: .
      dockerfile: apps/gender-router-bot/Dockerfile
    restart: unless-stopped
    environment:
      - GENDER_BOT_TOKEN=${GENDER_BOT_TOKEN}
      - MALE_CHAT_LINK=${MALE_CHAT_LINK}
      - FEMALE_CHAT_LINK=${FEMALE_CHAT_LINK}
      - GENDER_BOT_LANG=${GENDER_BOT_LANG}
      - GENDER_BOT_CHAT_LANGS=${GENDER_BOT_CHAT_LANGS}
    volumes:
      - ./apps/gender-router-bot/data:/app/apps/gender-router-bot/data

volumes:
  postgres_data:
