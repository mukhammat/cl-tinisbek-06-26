services:
  backend:
    build:
      context: .
      dockerfile: apps/nadeck-backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL}
    volumes:
      - backend_data:/app/data
    expose:
      - "3001"

  frontend:
    build:
      context: .
      dockerfile: apps/nadeck-frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  nadeck-bot:
    build:
      context: .
      dockerfile: apps/nadeck-bot/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BACKEND_URL=http://backend:3001
    volumes:
      - ./apps/nadeck-bot/data:/app/nadeck-bot/data

volumes:
  backend_data:
