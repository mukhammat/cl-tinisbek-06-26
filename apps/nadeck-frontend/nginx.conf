# ar.nadeck.net was shut down - its requests are dropped (444 closes the connection without a
# response) instead of falling through to the default server below and showing nadeck.net.
server {
    listen 80;
    server_name ar.nadeck.net;
    return 444;
}

# nadeck.net - also the default for any other/unmatched Host header.
server {
    listen 80 default_server;
    server_name nadeck.net www.nadeck.net _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Videos for the feed under the catalog are uploaded through here (up to 95MB).
        client_max_body_size 100m;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
