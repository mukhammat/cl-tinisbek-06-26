# Arabic-audience site (ar/en only, Arabic-first - see src/market.ts) - own bundle, same
# backend/catalog/DB as the main site for now.
server {
    listen 80;
    server_name ar.nadeck.net;

    root /usr/share/nginx/html/ar;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Main site (ru/en/ar) - also the default for any other/unmatched Host header.
server {
    listen 80 default_server;
    server_name nadeck.net www.nadeck.net _;

    root /usr/share/nginx/html/main;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
